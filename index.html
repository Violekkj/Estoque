<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estoque no Bolso</title>
<!-- Release v11: modular JavaScript and IndexedDB foundation -->
<meta name="description" content="Controle de estoque simples: entrada e saída, alerta de mínimo, lista de compras no WhatsApp e valor parado.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EDF0F4" id="themeColorMeta">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estoque">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="./assets/styles/app.css">
</head>
<body>
<div class="app-startup" id="appStartup" role="status" aria-live="polite"><div class="app-startup-card"><div class="app-startup-mark" aria-hidden="true">E</div><strong>Estoque no Bolso</strong><span>Carregando seus dados...</span></div></div>
<div class="col">
  <header class="top">
    <div class="top-row"><h1 id="title">Estoque no Bolso</h1><div class="top-btns"><button class="ghost" data-act="manual">Manual</button><button class="ghost backup-top-btn" data-act="backup" aria-label="Backup">Backup</button><button class="ghost" data-act="more">Mais</button></div></div>
    <div class="hero">
      <div class="lbl">Valor parado em estoque</div>
      <div class="val" id="totalVal">R$ 0,00</div>
      <div class="sub" id="totalSub"></div>
      <button class="alertbtn" id="alertBtn" data-act="show-low"><span id="alertTxt"></span><span class="go" id="alertGo"></span></button>
    </div>
  </header>

  <div id="banners"></div>

  <main>
    <div class="toolbar" id="toolbar">
      <input type="search" id="search" placeholder="Buscar produto" autocomplete="off" aria-label="Buscar produto">
    </div>
    <div id="view"></div>
  </main>
</div>

<button class="fab" id="fab" data-act="new">+ Produto</button>
<nav class="bottomnav" aria-label="Seções do app"><div class="bn" role="tablist">
  <button role="tab" data-act="tab" data-tab="prod" aria-selected="true"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg></span>Produtos</button>
  <button role="tab" data-act="tab" data-tab="buy" aria-selected="false"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11l2-8H6"/></svg><span class="badge" id="buyBadge" hidden>0</span></span>Compras</button>
  <button role="tab" data-act="tab" data-tab="hist" aria-selected="false"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>Histórico</button>
</div></nav>
<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<div id="confirmRoot"></div>
<script type="module" src="./src/app.js"></script>
<script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}

</script>
</body>
</html>
