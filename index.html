<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estoque no Bolso</title>
<meta name="description" content="Controle de estoque simples: entrada e saída, alerta de mínimo, lista de compras no WhatsApp e valor parado.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EDF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E151D" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estoque">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>html{scroll-padding-top:env(safe-area-inset-top,0px)}

/* Layout: coluna única de celular. Resumo no topo, abas fixas, cartões de produto com botões grandes de Entrada/Saída. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --fg:#131E2A; --muted:#566676; --line:#D7DEE6;
  --accent:#2150C8; --on-accent:#FFFFFF;
  --good:#0F7A55; --on-good:#FFFFFF;
  --bad:#C42B1F; --on-bad:#FFFFFF; --bad-bg:#FDEDEB; --bad-line:#F1B7B1;
  --shadow:0 1px 2px rgba(19,30,42,.06);
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-num:'Space Grotesk','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151D; --surface:#17212C; --fg:#E7EDF3; --muted:#93A3B3; --line:#263443;
    --accent:#7DA2FF; --on-accent:#0B1633;
    --good:#3DD6A0; --on-good:#06281C;
    --bad:#FF8A7E; --on-bad:#2A0B08; --bad-bg:#2F1A1A; --bad-line:#6A312C;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151D; --surface:#17212C; --fg:#E7EDF3; --muted:#93A3B3; --line:#263443;
  --accent:#7DA2FF; --on-accent:#0B1633;
  --good:#3DD6A0; --on-good:#06281C;
  --bad:#FF8A7E; --on-bad:#2A0B08; --bad-bg:#2F1A1A; --bad-line:#6A312C;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--f-body); font-size:15px; line-height:1.4;
  padding-block:0 150px;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--bg)}
.col{max-width:560px; margin:0 auto}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
h1,h2{font-family:var(--f-num); margin:0; letter-spacing:-.01em}

/* topo */
.top{padding-block:18px 12px; display:flex; flex-direction:column; gap:12px}
.top-row{display:flex; align-items:center; justify-content:space-between; gap:12px}
.top h1{font-size:20px; font-weight:700; min-width:0; overflow-wrap:anywhere}
.ghost{background:transparent; border:1px solid var(--line); border-radius:10px; padding:8px 14px; font-weight:600; min-height:40px}
.hero{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:var(--shadow)}
.hero .lbl{font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
.hero .val{font-family:var(--f-num); font-weight:700; font-size:34px; line-height:1.15; margin-top:4px; font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.hero .sub{color:var(--muted); font-size:13px; margin-top:2px}
.alertbtn{margin-top:12px; width:100%; text-align:left; display:flex; justify-content:space-between; align-items:center; gap:8px; border-radius:12px; padding:12px 14px; font-weight:600; border:1px solid var(--line); background:var(--bg); min-height:48px}
.alertbtn.on{background:var(--bad); border-color:var(--bad); color:var(--on-bad)}
.alertbtn .go{font-weight:500; font-size:13px; opacity:.9}

.banner{border:1px dashed var(--line); border-radius:12px; padding:12px 14px; background:var(--surface); display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:12px; font-size:14px}
.banner.warn{border-color:var(--bad-line); background:var(--bad-bg); border-style:solid}
.banner button{border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:8px 12px; font-weight:600; min-height:40px}

/* navegação inferior */
.bottomnav{position:fixed; left:0; right:0; bottom:0; z-index:25; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.bn{max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(3,1fr)}
.bn button{position:relative; border:0; background:transparent; color:var(--muted); min-height:64px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:11px; font-weight:600}
.bn button[aria-selected="true"]{color:var(--accent)}
.bn button[aria-selected="true"]::before{content:""; position:absolute; top:0; left:25%; right:25%; height:3px; border-radius:0 0 3px 3px; background:var(--accent)}
.bn svg{width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.ic{position:relative; display:flex}
.badge{position:absolute; top:-6px; right:-13px; background:var(--bad); color:var(--on-bad); border-radius:99px; font-size:11px; line-height:1; padding:3px 6px; font-family:var(--f-num); font-weight:700; font-variant-numeric:tabular-nums}

/* busca */
.toolbar{display:flex; flex-direction:column; gap:8px; margin-bottom:12px}
input[type=text],input[type=search],select,textarea{width:100%; background:var(--surface); border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; min-height:48px}
textarea{min-height:96px; resize:vertical; font-size:13px}
input::placeholder,textarea::placeholder{color:var(--muted)}

/* cartões */
.list{display:flex; flex-direction:column; gap:10px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px; min-width:0}
.card.low{background:var(--bad-bg); border-color:var(--bad-line)}
.c-top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start}
.c-name{font-weight:600; font-size:16px; overflow-wrap:anywhere; min-width:0}
.pill{background:var(--bad); color:var(--on-bad); border-radius:99px; font-size:12px; font-weight:700; padding:3px 10px; white-space:nowrap}
.c-meta{display:flex; flex-wrap:wrap; gap:2px 12px; color:var(--muted); font-size:13px; align-items:center; font-variant-numeric:tabular-nums}
.card.low .c-meta{color:var(--fg)}
.link{background:none; border:0; padding:4px 0; color:var(--accent); font-weight:600; font-size:13px; min-height:32px}
.c-bot{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
.qty{display:flex; align-items:baseline; gap:6px}
.qty .n{font-family:var(--f-num); font-weight:700; font-size:34px; line-height:1; font-variant-numeric:tabular-nums}
.qty .u{color:var(--muted); font-weight:600}
.card.low .qty .n{color:var(--bad)}
.acts{display:flex; gap:8px; flex:1 1 200px; justify-content:flex-end}
.btn{border:0; border-radius:12px; min-height:50px; padding:0 18px; font-weight:700; font-size:15px; display:inline-flex; align-items:center; justify-content:center; gap:6px; text-decoration:none; flex:1 1 0}
.btn.in{background:var(--good); color:var(--on-good)}
.btn.out{background:var(--surface); border:1.5px solid var(--fg); color:var(--fg)}
.btn.primary{background:var(--accent); color:var(--on-accent)}
.btn.plain{background:var(--bg); border:1px solid var(--line); color:var(--fg)}
.btn.disabled{opacity:.4; pointer-events:none}
.empty{background:var(--surface); border:1px dashed var(--line); border-radius:16px; padding:24px 18px; text-align:center; color:var(--muted)}
.empty b{display:block; color:var(--fg); font-size:16px; margin-bottom:4px}

/* compras */
.hint{color:var(--muted); font-size:13px; margin:0 0 12px}
.g-head{display:flex; justify-content:space-between; gap:8px; align-items:baseline; flex-wrap:wrap}
.g-head h2{font-size:17px; overflow-wrap:anywhere}
.g-head span{color:var(--muted); font-size:12px}
.row{display:grid; grid-template-columns:minmax(0,1fr) 84px auto; gap:10px; align-items:center; padding-block:8px; border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .nm{overflow-wrap:anywhere; font-weight:500}
.row .un{color:var(--muted); font-size:13px; min-width:28px}
.qin{text-align:center; min-height:44px; padding:8px; font-family:var(--f-num); font-weight:600; font-size:16px}
.tot{display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-variant-numeric:tabular-nums}
.tot b{font-family:var(--f-num); font-size:18px}
.g-acts{display:flex; gap:8px; flex-wrap:wrap}
.grand{margin-top:4px; padding:14px; border-radius:14px; background:var(--surface); border:1px solid var(--line)}

/* histórico */
.hrow{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 12px; padding:12px 14px; background:var(--surface); border:1px solid var(--line); border-radius:14px}
.hrow .nm{font-weight:600; overflow-wrap:anywhere}
.hrow .dt{color:var(--muted); font-size:12px}
.hrow .dl{font-family:var(--f-num); font-weight:700; font-size:18px; text-align:right; font-variant-numeric:tabular-nums}
.hrow .dl.in{color:var(--good)} .hrow .dl.out{color:var(--bad)}
.hrow .af{color:var(--muted); font-size:12px; text-align:right}

.top-btns{display:flex; gap:8px; flex-shrink:0}
.man{border-top:1px solid var(--line); padding-top:12px}
.man h3{margin:0 0 4px; font-family:var(--f-num); font-size:15px}
.man p{margin:0; color:var(--fg)}

/* botão flutuante */
.fab{position:fixed; right:calc(16px + env(safe-area-inset-right,0px)); bottom:calc(80px + env(safe-area-inset-bottom,0px)); z-index:15; background:var(--accent); color:var(--on-accent); border:0; border-radius:99px; min-height:54px; padding:0 22px; font-weight:700; font-size:16px; box-shadow:0 6px 18px rgba(0,0,0,.25)}

/* folha */
.overlay{position:fixed; inset:0; z-index:40; background:rgba(8,14,20,.55); display:flex; align-items:flex-end; justify-content:center}
.sheet{background:var(--surface); width:100%; max-width:560px; max-height:92%; overflow-y:auto; border-radius:20px 20px 0 0; padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:12px}
.sheet form{display:flex; flex-direction:column; gap:16px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline-offset:0; border-color:var(--accent)}
.sheet-h{display:flex; justify-content:space-between; align-items:center; gap:12px}
.sheet-h h2{font-size:20px}
.sub{margin:0; color:var(--muted)}
.sub b{color:var(--fg); font-family:var(--f-num)}
label{font-weight:600; font-size:13px; display:block; margin-bottom:6px}
.field{min-width:0}
.two{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.stepper{display:grid; grid-template-columns:56px minmax(0,1fr) 56px; gap:8px}
.stepper button{border:1.5px solid var(--line); background:var(--bg); border-radius:12px; font-size:24px; font-weight:600; min-height:56px}
.stepper input{text-align:center; font-family:var(--f-num); font-size:26px; font-weight:700; min-height:56px}
.err{margin:0; color:var(--bad); font-weight:600; min-height:1.2em}
.after{margin:0; color:var(--muted)}
.after b{color:var(--fg); font-family:var(--f-num)}
.sec{border-top:1px solid var(--line); padding-top:14px; display:flex; flex-direction:column; gap:10px}
.sec h3{margin:0; font-size:15px}
.sec p{margin:0; color:var(--muted); font-size:13px}
.danger{background:var(--bad-bg); border:1px solid var(--bad-line); color:var(--bad); border-radius:12px; min-height:46px; font-weight:700}

.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(148px + env(safe-area-inset-bottom,0px)); z-index:60; background:var(--fg); color:var(--bg); padding:10px 16px; border-radius:99px; font-weight:600; max-width:calc(100% - 32px); text-align:center}
@media (prefers-reduced-motion:no-preference){ .sheet{animation:up .18s ease-out} @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}} }

</style>
</head>
<body>
<div class="col">
  <header class="top">
    <div class="top-row"><h1 id="title">Estoque no Bolso</h1><div class="top-btns"><button class="ghost" data-act="manual">Manual</button><button class="ghost" data-act="more">Mais</button></div></div>
    <div class="hero">
      <div class="lbl">Valor parado em estoque</div>
      <div class="val" id="totalVal">R$ 0,00</div>
      <div class="sub" id="totalSub"></div>
      <button class="alertbtn" id="alertBtn" data-act="show-low"><span id="alertTxt"></span><span class="go" id="alertGo"></span></button>
    </div>
  </header>

  <div id="banners"></div>

  <main>
    <div class="toolbar" id="toolbar">
      <input type="search" id="search" placeholder="Buscar produto" autocomplete="off" aria-label="Buscar produto">
    </div>
    <div id="view"></div>
  </main>
</div>

<button class="fab" id="fab" data-act="new">+ Produto</button>
<nav class="bottomnav" aria-label="Seções do app"><div class="bn" role="tablist">
  <button role="tab" data-act="tab" data-tab="prod" aria-selected="true"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg></span>Produtos</button>
  <button role="tab" data-act="tab" data-tab="buy" aria-selected="false"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11l2-8H6"/></svg><span class="badge" id="buyBadge" hidden>0</span></span>Compras</button>
  <button role="tab" data-act="tab" data-tab="hist" aria-selected="false"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>Histórico</button>
</div></nav>
<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>

(function(){
'use strict';

// <logic>
var KEY = 'estoque-no-bolso-v1';
var BRL = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'});
function fmtMoney(n){ return BRL.format(n || 0); }
function fmtQty(n){ return (Number(n) || 0).toLocaleString('pt-BR', {maximumFractionDigits:3}); }
function r3(n){ return Math.round(n * 1000) / 1000; }
function parseNum(v){
  var s = String(v == null ? '' : v).trim().replace(',', '.');
  if (s === '') return NaN;
  var n = Number(s);
  return isFinite(n) ? n : NaN;
}
function isLow(p){ return p.qty < p.min; }
function totalValue(list){ return list.reduce(function(s, p){ return s + p.qty * p.cost; }, 0); }
function suggest(p){ return Math.max(0, Math.ceil(r3(p.min * 2 - p.qty))); }
function supplierKey(p){ return (p.supplier || '').trim() || 'Sem fornecedor'; }
function groupBuy(products, override){
  var map = {}, order = [];
  products.filter(isLow).forEach(function(p){
    var k = supplierKey(p);
    if (!map[k]) { map[k] = {key:k, phone:'', items:[]}; order.push(k); }
    var g = map[k];
    if (!g.phone && p.phone) g.phone = p.phone;
    var q = (override && override[p.id] != null) ? override[p.id] : suggest(p);
    g.items.push({id:p.id, name:p.name, unit:p.unit, q:q, cost:p.cost});
  });
  var groups = order.map(function(k){ return map[k]; });
  groups.sort(function(a, b){
    if (a.key === 'Sem fornecedor') return 1;
    if (b.key === 'Sem fornecedor') return -1;
    return a.key.localeCompare(b.key, 'pt-BR');
  });
  return groups;
}
function validItems(g){ return g.items.filter(function(i){ return i.q > 0; }); }
function groupCost(g){ return validItems(g).reduce(function(s, i){ return s + i.q * i.cost; }, 0); }
function buildMessage(shop, g){
  var lines = validItems(g).map(function(i){ return '• ' + i.name + ' — ' + fmtQty(i.q) + ' ' + i.unit; });
  var who = (shop || '').trim();
  return 'Olá! ' + (who ? 'Aqui é da *' + who + '*. ' : '') + 'Preciso fazer um pedido:\n\n' +
    lines.join('\n') + '\n\nPode confirmar o valor e o prazo de entrega? Obrigado!';
}
function waLink(phone, text){
  var d = String(phone || '').replace(/\D/g, '');
  if (d && d.length <= 11) d = '55' + d;
  return 'https://wa.me/' + d + '?text=' + encodeURIComponent(text);
}
function clean(s, max){ return String(s == null ? '' : s).slice(0, max); }
function sanitize(obj){
  if (!obj || typeof obj !== 'object' || !Array.isArray(obj.products)) return null;
  var units = ['un','kg','g','L','ml','cx','pct','fardo'];
  var out = {shop: clean(obj.shop, 60), demo: false, products: [], log: []};
  obj.products.slice(0, 2000).forEach(function(p){
    if (!p || typeof p !== 'object') return;
    var name = clean(p.name, 80).trim();
    if (!name) return;
    var num = function(v){ var n = Number(v); return isFinite(n) && n >= 0 ? r3(n) : 0; };
    out.products.push({
      id: clean(p.id, 30) || newId(), name: name,
      unit: units.indexOf(p.unit) >= 0 ? p.unit : 'un',
      qty: num(p.qty), min: num(p.min), cost: Math.round(num(p.cost) * 100) / 100,
      supplier: clean(p.supplier, 60).trim(), phone: clean(p.phone, 20).trim()
    });
  });
  (Array.isArray(obj.log) ? obj.log : []).slice(0, 200).forEach(function(l){
    if (!l || typeof l !== 'object') return;
    var d = Number(l.d), a = Number(l.after), t = Number(l.t);
    if (!isFinite(d) || !isFinite(a) || !isFinite(t)) return;
    out.log.push({t:t, id:clean(l.id, 30), name:clean(l.name, 80), unit:clean(l.unit, 8), d:d, after:a});
  });
  out.demo = !!obj.demo;
  return out;
}
function newId(){ return Math.random().toString(36).slice(2, 9) + Date.now().toString(36); }
// </logic>

var state, override = {}, tab = 'prod', onlyLow = false, search = '', persisted = true;

function demoState(){
  var P = function(name, unit, qty, min, cost, supplier){ return {id:newId(), name:name, unit:unit, qty:qty, min:min, cost:cost, supplier:supplier, phone:''}; };
  return {shop:'', demo:true, log:[], products:[
    P('Arroz branco 5 kg','un',18,10,24.9,'Distribuidora Santa Rita'),
    P('Feijão carioca 1 kg','un',6,20,7.8,'Distribuidora Santa Rita'),
    P('Óleo de soja 900 ml','un',40,24,6.5,'Distribuidora Santa Rita'),
    P('Açúcar refinado 1 kg','un',9,12,4.2,'Distribuidora Santa Rita'),
    P('Café torrado 500 g','un',3,8,16.9,'Café Serra Alta'),
    P('Refrigerante 2 L','un',30,18,6.9,'Bebidas Vila Nova'),
    P('Água mineral 500 ml','un',12,48,1.2,'Bebidas Vila Nova'),
    P('Detergente 500 ml','un',22,10,1.8,'')
  ]};
}
function load(){
  try { var raw = localStorage.getItem(KEY); if (raw) { var s = sanitize(JSON.parse(raw)); if (s) return s; } } catch(e) {}
  return null;
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); persisted = true; } catch(e) { persisted = false; }
  renderBanners();
}
state = load() || demoState();

/* Guarda os dados reais enquanto a pessoa vê o exemplo */
var STASH_KEY = KEY + '-meus-dados', stashMem = null;
function getStash(){
  try { var raw = localStorage.getItem(STASH_KEY); if (raw) { var s = sanitize(JSON.parse(raw)); if (s) return s; } } catch(e) {}
  return stashMem;
}
function setStash(s){
  stashMem = s;
  try { if (s) localStorage.setItem(STASH_KEY, JSON.stringify(s)); else localStorage.removeItem(STASH_KEY); } catch(e) {}
}

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function find(id){ return state.products.filter(function(p){ return p.id === id; })[0]; }
var toastT;
function toast(msg){ var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function(){ t.hidden = true; }, 2400); }
function fmtDate(t){ return new Date(t).toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}); }

/* ---------- renderização ---------- */
function renderStats(){
  var low = state.products.filter(isLow).length;
  $('title').textContent = state.shop.trim() || 'Estoque no Bolso';
  $('totalVal').textContent = fmtMoney(totalValue(state.products));
  var n = state.products.length;
  $('totalSub').textContent = n + (n === 1 ? ' produto cadastrado' : ' produtos cadastrados') + ' · quantidade × custo';
  var b = $('alertBtn');
  b.classList.toggle('on', low > 0);
  $('alertTxt').textContent = low === 0 ? 'Nada abaixo do mínimo' : low + (low === 1 ? ' produto abaixo do mínimo' : ' produtos abaixo do mínimo');
  $('alertGo').textContent = low === 0 ? '' : (onlyLow && tab === 'prod' ? 'Mostrando só estes' : 'Ver');
  b.disabled = low === 0;
  var bb = $('buyBadge'); bb.hidden = low === 0; bb.textContent = low;
}
function renderBanners(){
  var h = '';
  if (!persisted) h += '<div class="banner warn"><span>Este navegador não está guardando os dados. Faça o backup em <b>Mais</b> antes de fechar.</span></div>';
  if (state.demo) {
    var mine = !!getStash();
    h += '<div class="banner"><span>' + (mine ? 'Estes são dados de exemplo. Os seus dados estão guardados.' : 'Estes são dados de exemplo.') + '</span><button data-act="' + (mine ? 'back-mine' : 'clear-demo') + '">' + (mine ? 'Voltar aos meus dados' : 'Começar do zero') + '</button></div>';
  }
  $('banners').innerHTML = h;
}
function renderTabs(){
  document.querySelectorAll('[data-act="tab"]').forEach(function(b){ b.setAttribute('aria-selected', String(b.dataset.tab === tab)); });
  $('toolbar').hidden = tab !== 'prod';
  $('fab').hidden = tab !== 'prod';
}
function renderProducts(){
  var q = search.trim().toLowerCase();
  var list = state.products.filter(function(p){ return !q || p.name.toLowerCase().indexOf(q) >= 0; });
  if (onlyLow) list = list.filter(isLow);
  list.sort(function(a, b){ return (isLow(b) - isLow(a)) || a.name.localeCompare(b.name, 'pt-BR'); });
  if (!state.products.length) return '<div class="empty"><b>Nenhum produto ainda</b>Toque em “+ Produto” para cadastrar o primeiro.' + (state.demo ? '' : '<br><button class="btn plain" style="flex:none; margin-top:14px" data-act="show-demo">Ver dados de exemplo</button>') + '</div>';
  if (!list.length) return '<div class="empty"><b>Nada encontrado</b>' + (onlyLow ? 'Nenhum produto abaixo do mínimo.' : 'Tente outro nome.') + '</div>';
  return '<div class="list">' + list.map(function(p){
    var low = isLow(p);
    return '<article class="card' + (low ? ' low' : '') + '">' +
      '<div class="c-top"><div class="c-name">' + esc(p.name) + '</div>' + (low ? '<span class="pill">' + (p.qty <= 0 ? 'Zerado' : 'Abaixo do mínimo') + '</span>' : '') + '</div>' +
      '<div class="c-meta"><span>Mínimo ' + fmtQty(p.min) + ' ' + esc(p.unit) + '</span><span>Custo ' + fmtMoney(p.cost) + '</span><span>Parado ' + fmtMoney(p.qty * p.cost) + '</span><button class="link" data-act="edit" data-id="' + p.id + '">Editar</button></div>' +
      '<div class="c-bot"><div class="qty"><span class="n">' + fmtQty(p.qty) + '</span><span class="u">' + esc(p.unit) + '</span></div>' +
      '<div class="acts"><button class="btn out" data-act="mov" data-kind="out" data-id="' + p.id + '">− Saída</button><button class="btn in" data-act="mov" data-kind="in" data-id="' + p.id + '">+ Entrada</button></div></div>' +
      '</article>';
  }).join('') + '</div>';
}
function renderBuy(){
  var groups = groupBuy(state.products, override);
  if (!groups.length) return '<div class="empty"><b>Nada para repor</b>Todos os produtos estão no mínimo ou acima dele.</div>';
  var h = '<p class="hint">Sugestão: repor até o dobro do mínimo. Ajuste as quantidades antes de enviar.</p><div class="list">';
  groups.forEach(function(g, gi){
    h += '<section class="card" data-g="' + gi + '"><div class="g-head"><h2>' + esc(g.key) + '</h2><span>' + (g.phone ? 'WhatsApp ' + esc(g.phone) : 'Sem número: você escolhe o contato no WhatsApp') + '</span></div><div>';
    g.items.forEach(function(i){
      h += '<div class="row"><span class="nm">' + esc(i.name) + '</span><input class="qin" type="text" inputmode="decimal" autocomplete="off" aria-label="Quantidade de ' + esc(i.name) + '" data-id="' + i.id + '" data-g="' + gi + '" value="' + esc(fmtQty(i.q).replace(/\./g, '')) + '"><span class="un">' + esc(i.unit) + '</span></div>';
    });
    h += '</div><div class="tot"><span>Total estimado pelo seu custo</span><b data-sub="' + gi + '">' + fmtMoney(groupCost(g)) + '</b></div>' +
      '<div class="g-acts"><a class="btn in" data-wa="' + gi + '" target="_blank" rel="noopener" href="' + esc(waLink(g.phone, buildMessage(state.shop, g))) + '">Enviar no WhatsApp</a>' +
      '<button class="btn plain" data-act="copy-buy" data-g="' + gi + '">Copiar texto</button></div></section>';
  });
  h += '</div><div class="grand tot"><span>Compra total estimada</span><b id="grand">' + fmtMoney(groups.reduce(function(s, g){ return s + groupCost(g); }, 0)) + '</b></div>';
  return h;
}
function renderHist(){
  if (!state.log.length) return '<div class="empty"><b>Sem movimentos</b>As entradas e saídas aparecem aqui.</div>';
  return '<div class="list">' + state.log.map(function(l){
    var inn = l.d > 0;
    return '<div class="hrow"><span class="nm">' + esc(l.name) + '</span><span class="dl ' + (inn ? 'in' : 'out') + '">' + (inn ? '+' : '−') + fmtQty(Math.abs(l.d)) + ' ' + esc(l.unit) + '</span><span class="dt">' + fmtDate(l.t) + '</span><span class="af">ficou com ' + fmtQty(l.after) + '</span></div>';
  }).join('') + '</div>';
}
function render(){
  renderStats(); renderBanners(); renderTabs();
  $('view').innerHTML = tab === 'prod' ? renderProducts() : tab === 'buy' ? renderBuy() : renderHist();
}

/* ---------- folhas ---------- */
function openSheet(html, focusId){
  $('sheet').innerHTML = html; $('overlay').hidden = false;
  if (focusId && $(focusId)) { $(focusId).focus(); if ($(focusId).select) $(focusId).select(); }
}
function closeSheet(){ $('overlay').hidden = true; $('sheet').innerHTML = ''; }
function movSheet(p, kind){
  var inn = kind === 'in';
  openSheet('<form id="movForm" data-id="' + p.id + '" data-kind="' + kind + '" novalidate>' +
    '<div class="sheet-h"><h2>' + (inn ? 'Entrada' : 'Saída') + '</h2><button type="button" class="ghost" data-act="close">Fechar</button></div>' +
    '<p class="sub">' + esc(p.name) + ' · em estoque: <b>' + fmtQty(p.qty) + ' ' + esc(p.unit) + '</b></p>' +
    '<div class="field" style="margin-top:12px"><label for="movQty">Quantidade (' + esc(p.unit) + ')</label>' +
    '<div class="stepper"><button type="button" data-act="step" data-d="-1" aria-label="Diminuir">−</button><input type="text" id="movQty" inputmode="decimal" autocomplete="off" value="1"><button type="button" data-act="step" data-d="1" aria-label="Aumentar">+</button></div></div>' +
    '<p class="err" id="movErr" role="alert"></p><p class="after" id="movAfter"></p>' +
    '<button type="submit" class="btn ' + (inn ? 'in' : 'primary') + '" style="width:100%">Registrar ' + (inn ? 'entrada' : 'saída') + '</button></form>', 'movQty');
  updateMov();
}
function updateMov(){
  var f = $('movForm'); if (!f) return;
  var p = find(f.dataset.id), kind = f.dataset.kind, n = parseNum($('movQty').value);
  var err = '', after = '';
  if (isNaN(n) || n <= 0) err = 'Digite uma quantidade maior que zero.';
  else if (kind === 'out' && n > p.qty) err = 'A saída é maior que o estoque atual (' + fmtQty(p.qty) + ' ' + p.unit + ').';
  else { var a = r3(p.qty + (kind === 'in' ? n : -n)); after = 'Vai ficar com <b>' + fmtQty(a) + ' ' + esc(p.unit) + '</b>' + (a < p.min ? ' — abaixo do mínimo (' + fmtQty(p.min) + ')' : ''); }
  $('movErr').textContent = err; $('movAfter').innerHTML = after;
  return !err;
}
function productSheet(p){
  var isNew = !p; p = p || {name:'', unit:'un', qty:0, min:0, cost:0, supplier:'', phone:''};
  var units = ['un','kg','g','L','ml','cx','pct','fardo'];
  var sup = {}; state.products.forEach(function(x){ if (x.supplier) sup[x.supplier] = 1; });
  var money = function(n){ return n ? String(n).replace('.', ',') : ''; };
  openSheet('<form id="prodForm" data-id="' + (isNew ? '' : p.id) + '" novalidate>' +
    '<div class="sheet-h"><h2>' + (isNew ? 'Novo produto' : 'Editar produto') + '</h2><button type="button" class="ghost" data-act="close">Fechar</button></div>' +
    '<div class="field"><label for="pName">Nome</label><input type="text" id="pName" maxlength="80" autocomplete="off" value="' + esc(p.name) + '" placeholder="Ex.: Arroz branco 5 kg"></div>' +
    '<div class="two"><div class="field"><label for="pUnit">Unidade</label><select id="pUnit">' + units.map(function(u){ return '<option' + (u === p.unit ? ' selected' : '') + '>' + u + '</option>'; }).join('') + '</select></div>' +
    '<div class="field"><label for="pCost">Custo por unidade (R$)</label><input type="text" id="pCost" inputmode="decimal" autocomplete="off" value="' + money(p.cost) + '" placeholder="0,00"></div></div>' +
    '<div class="two">' + (isNew ? '<div class="field"><label for="pQty">Quantidade agora</label><input type="text" id="pQty" inputmode="decimal" autocomplete="off" value="' + (p.qty || '') + '" placeholder="0"></div>' : '<div class="field"><label>Em estoque</label><input type="text" value="' + fmtQty(p.qty) + ' ' + esc(p.unit) + '" disabled></div>') +
    '<div class="field"><label for="pMin">Estoque mínimo</label><input type="text" id="pMin" inputmode="decimal" autocomplete="off" value="' + (p.min || '') + '" placeholder="0"></div></div>' +
    (isNew ? '' : '<p class="sub">Para mudar a quantidade, use Entrada ou Saída.</p>') +
    '<div class="field"><label for="pSup">Fornecedor</label><input type="text" id="pSup" maxlength="60" list="supList" autocomplete="off" value="' + esc(p.supplier) + '" placeholder="Nome do fornecedor"><datalist id="supList">' + Object.keys(sup).map(function(s){ return '<option value="' + esc(s) + '">'; }).join('') + '</datalist></div>' +
    '<div class="field"><label for="pPhone">WhatsApp do fornecedor (com DDD)</label><input type="text" id="pPhone" inputmode="tel" maxlength="20" autocomplete="off" value="' + esc(p.phone) + '" placeholder="11 91234-5678"></div>' +
    '<p class="err" id="pErr" role="alert"></p>' +
    '<button type="submit" class="btn primary" style="width:100%">Salvar</button>' +
    (isNew ? '' : '<button type="button" class="danger" data-act="del" data-id="' + p.id + '">Excluir produto</button>') + '</form>', isNew ? 'pName' : null);
}
function moreSheet(){
  openSheet('<div class="sheet-h"><h2>Mais</h2><button type="button" class="ghost" data-act="close">Fechar</button></div>' +
    '<div class="field"><label for="shopName">Nome do seu comércio</label><input type="text" id="shopName" maxlength="60" autocomplete="off" value="' + esc(state.shop) + '" placeholder="Aparece no pedido do WhatsApp"></div>' +
    (state.demo ? '' : '<div class="sec"><h3>Dados de exemplo</h3><p>Veja o app preenchido com produtos de exemplo. Os seus dados ficam guardados e voltam quando você quiser.</p><button type="button" class="btn plain" data-act="show-demo">Ver dados de exemplo</button></div>') +
    '<div class="sec"><h3>Backup</h3><p>Os dados ficam salvos neste celular. Copie o backup de vez em quando e guarde numa conversa sua.</p>' +
    '<textarea id="bkOut" readonly aria-label="Texto do backup">' + esc(JSON.stringify(state)) + '</textarea><button type="button" class="btn plain" data-act="copy-bk">Copiar backup</button></div>' +
    '<div class="sec"><h3>Restaurar backup</h3><p>Cole aqui o texto de um backup. Isso troca os dados deste celular.</p>' +
    '<textarea id="bkIn" aria-label="Colar backup" placeholder="Cole o backup aqui"></textarea><p class="err" id="bkErr" role="alert"></p><button type="button" class="btn plain" data-act="restore">Restaurar</button></div>' +
    '<div class="sec"><h3>Apagar tudo</h3><p>Remove produtos e histórico deste celular.</p><button type="button" class="danger" data-act="wipe">Apagar tudo</button></div>', null);
}

function manualSheet(){
  var items = [
    ['Para que serve', 'Controla o estoque do seu comércio: você cadastra os produtos, registra o que entra e o que sai, e o app avisa o que está acabando.'],
    ['1. Cadastre os produtos', 'Toque em “+ Produto”. Informe nome, unidade, custo, quantidade atual e o estoque mínimo, que é a quantidade abaixo da qual você quer ser avisado. Para pedir pelo WhatsApp, informe também o fornecedor e o número dele.'],
    ['2. Registre entradas e saídas', 'Em cada produto, use “+ Entrada” quando chegar mercadoria e “− Saída” quando sair (venda, perda ou uso). Use “Editar” para corrigir nome, custo, mínimo ou fornecedor. Tudo fica na aba Histórico.'],
    ['3. Veja o alerta vermelho', 'O produto que fica abaixo do mínimo ganha destaque vermelho e sobe para o topo da lista. No resumo, o botão vermelho mostra quantos estão assim. Toque nele para ver só esses.'],
    ['4. Faça a lista de compras', 'Na aba Compras, o que está em falta aparece separado por fornecedor, com uma quantidade sugerida (o dobro do mínimo, menos o que você tem). Ajuste os números e toque em “Enviar no WhatsApp”: o pedido já vai escrito. Sem número cadastrado, você escolhe o contato no WhatsApp. Também dá para copiar o texto.'],
    ['5. Valor parado em estoque', 'É a soma de quantidade × custo de todos os produtos. Aparece no topo e mostra quanto dinheiro está guardado em mercadoria.'],
    ['Seus dados', 'Ficam salvos neste celular, sem login. Em “Mais” você copia um backup e restaura quando precisar. Se limpar os dados do navegador ou trocar de celular, só o backup traz tudo de volta.']
  ];
  openSheet('<div class="sheet-h"><h2>Manual</h2><button type="button" class="ghost" data-act="close">Fechar</button></div>' +
    items.map(function(it, i){ return '<section class="man"' + (i === 0 ? ' style="border-top:0; padding-top:0"' : '') + '><h3>' + it[0] + '</h3><p>' + it[1] + '</p></section>'; }).join('') +
    (state.demo ? '' : '<button type="button" class="btn plain" style="flex:none" data-act="show-demo">Ver dados de exemplo</button>'), null);
}
function showDemo(){
  if (state.demo) { closeSheet(); return; }
  if (state.products.length || state.log.length) setStash(JSON.parse(JSON.stringify(state)));
  state = demoState(); override = {}; tab = 'prod'; onlyLow = false; search = ''; $('search').value = '';
  save(); closeSheet(); render(); toast('Mostrando dados de exemplo');
}

/* ---------- ações ---------- */
function applyMove(id, kind, amount){
  var p = find(id); var d = kind === 'in' ? amount : -amount;
  p.qty = r3(p.qty + d);
  state.log.unshift({t:Date.now(), id:p.id, name:p.name, unit:p.unit, d:d, after:p.qty});
  state.log.length = Math.min(state.log.length, 200);
  delete override[id];
  save();
}
function copyText(text, okMsg){
  function fallback(){
    try { var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); var ok = document.execCommand('copy'); document.body.removeChild(ta); toast(ok ? okMsg : 'Não deu para copiar. Selecione o texto e copie.'); }
    catch(e){ toast('Não deu para copiar. Selecione o texto e copie.'); }
  }
  try { navigator.clipboard.writeText(text).then(function(){ toast(okMsg); }, fallback); } catch(e) { fallback(); }
}
function updateGroup(gi){
  var g = groupBuy(state.products, override)[gi]; if (!g) return;
  var a = document.querySelector('[data-wa="' + gi + '"]');
  a.href = waLink(g.phone, buildMessage(state.shop, g));
  a.classList.toggle('disabled', validItems(g).length === 0);
  document.querySelector('[data-sub="' + gi + '"]').textContent = fmtMoney(groupCost(g));
  var all = groupBuy(state.products, override);
  $('grand').textContent = fmtMoney(all.reduce(function(s, x){ return s + groupCost(x); }, 0));
}
var wipeArmed = false, delArmed = false;

document.addEventListener('click', function(e){
  var wa = e.target.closest('[data-wa]');
  if (wa && wa.classList.contains('disabled')) { e.preventDefault(); return; }
  var el = e.target.closest('[data-act]'); if (!el) return;
  var act = el.dataset.act;
  if (act === 'tab') { tab = el.dataset.tab; render(); }
  else if (act === 'show-low') { var wasProd = tab === 'prod'; tab = 'prod'; onlyLow = wasProd ? !onlyLow : true; render(); }
  else if (act === 'new') productSheet(null);
  else if (act === 'edit') productSheet(find(el.dataset.id));
  else if (act === 'mov') movSheet(find(el.dataset.id), el.dataset.kind);
  else if (act === 'more') { wipeArmed = false; moreSheet(); }
  else if (act === 'manual') manualSheet();
  else if (act === 'show-demo') showDemo();
  else if (act === 'back-mine') {
    var mine = getStash(); if (!mine) return;
    state = mine; setStash(null); override = {}; save(); render(); toast('Seus dados voltaram');
  }
  else if (act === 'close') closeSheet();
  else if (act === 'step') { var inp = $('movQty'); var n = parseNum(inp.value); inp.value = String(Math.max(0, (isNaN(n) ? 0 : n) + Number(el.dataset.d))).replace('.', ','); updateMov(); }
  else if (act === 'clear-demo') { state = {shop:state.shop, demo:false, products:[], log:[]}; override = {}; save(); render(); toast('Pronto. Cadastre seus produtos.'); }
  else if (act === 'copy-buy') { var g = groupBuy(state.products, override)[Number(el.dataset.g)]; if (g) copyText(buildMessage(state.shop, g), 'Texto copiado'); }
  else if (act === 'copy-bk') { var t = $('bkOut'); t.select(); copyText(t.value, 'Backup copiado'); }
  else if (act === 'restore') {
    var raw = $('bkIn').value.trim(), s = null;
    try { s = sanitize(JSON.parse(raw)); } catch(err) {}
    if (!s) { $('bkErr').textContent = 'Esse texto não é um backup válido.'; return; }
    if (el.dataset.armed !== '1') { el.dataset.armed = '1'; el.textContent = 'Confirmar: trocar os dados deste celular'; $('bkErr').textContent = ''; return; }
    state = s; setStash(null); override = {}; save(); closeSheet(); render(); toast('Backup restaurado');
  }
  else if (act === 'wipe') {
    if (!wipeArmed) { wipeArmed = true; el.textContent = 'Toque de novo para confirmar'; return; }
    state = {shop:state.shop, demo:false, products:[], log:[]}; setStash(null); override = {}; save(); closeSheet(); render(); toast('Tudo apagado');
  }
  else if (act === 'del') {
    if (el.dataset.armed !== '1') { el.dataset.armed = '1'; el.textContent = 'Toque de novo para excluir'; return; }
    state.products = state.products.filter(function(p){ return p.id !== el.dataset.id; }); delete override[el.dataset.id]; save(); closeSheet(); render(); toast('Produto excluído');
  }
});
$('overlay').addEventListener('click', function(e){ if (e.target === $('overlay')) closeSheet(); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !$('overlay').hidden) closeSheet(); });

document.addEventListener('input', function(e){
  var t = e.target;
  if (t.id === 'search') { search = t.value; $('view').innerHTML = renderProducts(); }
  else if (t.id === 'movQty') updateMov();
  else if (t.id === 'shopName') { state.shop = t.value; save(); renderStats(); }
  else if (t.classList && t.classList.contains('qin')) {
    var n = parseNum(t.value); override[t.dataset.id] = isNaN(n) || n < 0 ? 0 : n; updateGroup(Number(t.dataset.g));
  }
});
document.addEventListener('submit', function(e){
  e.preventDefault();
  var f = e.target;
  if (f.id === 'movForm') {
    if (!updateMov()) return;
    var n = parseNum($('movQty').value), kind = f.dataset.kind, p = find(f.dataset.id);
    applyMove(p.id, kind, n); closeSheet(); render();
    toast((kind === 'in' ? 'Entrada' : 'Saída') + ' registrada: ' + p.name);
  } else if (f.id === 'prodForm') {
    var name = $('pName').value.trim(), min = parseNum($('pMin').value || '0'), cost = parseNum($('pCost').value || '0');
    var qty = $('pQty') ? parseNum($('pQty').value || '0') : null;
    var err = '';
    if (!name) err = 'Digite o nome do produto.';
    else if (isNaN(min) || min < 0) err = 'O estoque mínimo precisa ser um número.';
    else if (isNaN(cost) || cost < 0) err = 'O custo precisa ser um número, como 4,50.';
    else if (qty !== null && (isNaN(qty) || qty < 0)) err = 'A quantidade precisa ser um número.';
    if (err) { $('pErr').textContent = err; return; }
    var data = {name:name, unit:$('pUnit').value, min:r3(min), cost:Math.round(cost * 100) / 100, supplier:$('pSup').value.trim(), phone:$('pPhone').value.trim()};
    if (f.dataset.id) { var p2 = find(f.dataset.id); Object.keys(data).forEach(function(k){ p2[k] = data[k]; }); delete override[p2.id]; }
    else { data.id = newId(); data.qty = r3(qty); state.products.push(data); }
    save(); closeSheet(); render(); toast('Produto salvo');
  }
});

render();
})();

</script>

try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
